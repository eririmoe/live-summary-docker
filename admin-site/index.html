<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f1f8e6"><title>处理后台 · 直播留声簿</title><meta name="color-scheme" content="light"><link rel="icon" type="image/svg+xml" href="/favicon.svg?v=melon1"><link rel="stylesheet" href="/admin.css?v=merge9"><script data-cfasync="false" src="/admin.js?v=priority22" defer></script></head>
<body><header><a href="/">直播留声簿<small>LIVE SUMMARY · OPERATIONS</small></a><button id="logout" hidden>退出登录</button></header>
<main><section id="login" hidden><p class="eyebrow">PRIVATE CONSOLE</p><h1>查看每一场的进度。</h1><p>使用录播操作页的账号与密码登录。</p><form id="login-form"><label>账号<input name="username" autocomplete="username" required maxlength="200"></label><label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="500"></label><button type="submit">登录后台 <span>↗</span></button></form><p id="login-error" role="alert"></p></section>
<section id="console" hidden><div class="heading"><div><p class="eyebrow">PROCESSING OVERVIEW</p><h1>录播处理情况</h1></div><button id="refresh">刷新状态</button></div><p id="freshness" role="status">正在读取状态…</p><div id="metrics" class="metrics"></div><div id="system" class="system"></div><h2>处理队列 <small>最近 100 项</small></h2><div id="jobs"></div><div class="bottom-grid"><section class="panel"><h2>下播检测</h2><p id="detection"></p><h3>最近收到的录播事件</h3><ul id="events"></ul></section><section class="panel"><h2>最近发布</h2><div id="deployment"></div><p>百分比若可获取，表示百度网盘当前文件的上传进度；其他阶段显示已完成的步骤，不估算整场百分比。</p></section></div></section><p id="fatal" role="alert"></p></main><footer>直播留声簿 · 私人处理后台 <span>每 15 秒自动更新</span></footer></body></html>
