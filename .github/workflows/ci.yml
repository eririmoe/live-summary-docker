name: Build and verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Scan public source
        run: python3 scripts/scan_public.py --tracked
      - name: Build complete runtime
        run: docker build -t live-summary:test .
      - name: Run isolated Python and FFmpeg tests
        run: |
          docker run --rm --read-only --network none --tmpfs /tmp:rw,size=256m \
            -e LIVE_SUMMARY_STATE=/tmp/test-state -e LIVE_SUMMARY_RECORDS=/tmp/test-records \
            live-summary:test python -m unittest discover -s tests -v
      - name: Test static search
        run: node tests/test_archive_search.cjs
      - name: Validate Compose without printing credentials
        env:
          BREC_HTTP_BASIC_USER: synthetic
          BREC_HTTP_BASIC_PASS: synthetic-test-password
        run: docker compose --profile recorder config --quiet
      - name: Initialize from empty state and start the actual services
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace --entrypoint python live-summary:test -c "import json; from scripts.setup import initialize; initialize({'config':{'room_id':123456789,'streamer':'Synthetic CI','record_dir':'ci-recordings'},'recorder_secrets':{'RECORDER_USER':'synthetic','RECORDER_PASS':'synthetic-ci-password'}})"
          APP_IMAGE=live-summary:test docker compose up -d --no-build --wait worker admin
          docker compose exec -T worker python -c "import requests; assert requests.get('http://127.0.0.1:8080/data/index.json').status_code==200; assert requests.get('http://admin:8081/api/status').status_code==401"
      - name: Remove test services
        if: always()
        run: docker compose down --remove-orphans
